[package]
name = "jqlite"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "jqlite: a portable profile of the jq language (Rust port of the JQLite reference)"
license = "MIT"

[lib]
name = "jqlite"
path = "src/lib.rs"

[dependencies]
stacker = "0.1"

# The runner of the cross-language benchmark is a package of its own (bench/), so that the library
# has no build script; `cargo build --release` builds both.
[workspace]
members = [".", "bench"]
default-members = [".", "bench"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
